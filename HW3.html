<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Map</title>

     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <script src="./schools.js"></script>




</head>
<body>

    <div id="mapid"></div>
    <style>
        #mapid{width:900px; height: 500px;}
    </style>

    <script>
        var map = L.map("mapid").setView([35.77296841827961, -78.89973632725632], 10);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map)
        

        L.geoJSON(triangleHighSchools).addTo(map);;
         var HSicon = L.icon({
            iconUrl: "https://cdn-icons-png.flaticon.com/512/3610/3610185.png", 
            iconSize: [25,25],
            popupAnchor: [0, 0]
        });

        var customPopup = "<h1>Hurricane Sergio</h1><img src='https://zoom.earth/assets/images/storms/2048/2018/sergio.jpg' width='100' height='100'><p>2018</p>";

        L.geoJSON(triangleHighSchools, {
            pointToLayer: function(feature, latlng){
                return L.marker(latlng, {icon: HSicon});
            }
        }).bindPopup(customPopup).addTo(map);
        function popupHTML(props) {
      return `
        <h3>${props.name}</h3>
        <p><b>City:</b> ${props.city}</p>
        <p>${props.message}</p>
      `;
    }

    var hsLayer = L.geoJSON(triangleHighSchools, {
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 8,
          weight: 2,
          fillOpacity: 0.75
        });
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(popupHTML(feature.properties));
      }
    }).addTo(map);

    // Fit map to show all points
    map.fitBounds(hsLayer.getBounds(), { padding: [20, 20] });

    // -----------------------------
    // Layer control: 2 tile layers + 1 vector layer
    // -----------------------------
    var baseMaps = {
      "OpenTopoMap": topo,
      "OpenStreetMap": osm
    };

    var overlayMaps = {
      "Triangle High Schools (GeoJSON)": hsLayer
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    </script>
    
</body>
</html>
